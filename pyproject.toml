[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "envguard-tools"
version = "0.1.1"
description = "A lightweight CLI and validator to prevent missing, drifted, or misconfigured environment variables."
readme = "README.md"
authors = [{ name = "Faizan", email = "mfk.faizan.work@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
envguard = "envguard.cli:main"

[project.urls]
Homepage = "https://github.com/Faizan-902/envguard"
Repository = "https://github.com/Faizan-902/envguard.git"

[tool.coverage.run]
source = ["envguard"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mypy]
python_version = "3.10"
strict = true
