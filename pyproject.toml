[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "envguard-tools"
version = "0.2.0"
description = "A lightweight CLI and validator to prevent missing, drifted, or misconfigured environment variables."
readme = "README.md"
authors = [{ name = "Faizan", email = "mfk.faizan.work@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
envguard = "envguard.cli:main"

[project.urls]
Homepage = "https://github.com/Faizan-902/envguard"
Repository = "https://github.com/Faizan-902/envguard.git"

[tool.setuptools.package-data]
envguard = ["py.typed"]

[tool.coverage.run]
source = ["envguard"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mypy]
python_version = "3.10"
strict = true
