name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build twine

      # A tag push does not run ci.yml (it only listens on branches), so the
      # release is gated here: never publish an untested build to PyPI.
      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import envguard

          expected = f"v{envguard.__version__}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"tag {actual} does not match package version {expected}")
          PY

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: twine check dist/*

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload --skip-existing dist/*
